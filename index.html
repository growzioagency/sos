```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Website Under Maintenance</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #111111;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            width: 100%;
        }

        .icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 30px;
            border-radius: 50%;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
        }

        h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 18px;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
            color: #666;
            margin-bottom: 30px;
        }

        .line {
            width: 60px;
            height: 4px;
            background: #111;
            margin: 0 auto 30px;
            border-radius: 10px;
        }

        .status {
            display: inline-block;
            padding: 12px 22px;
            border: 1px solid #ddd;
            border-radius: 30px;
            font-size: 14px;
            color: #444;
            background: #fafafa;
        }

        .footer {
            margin-top: 50px;
            font-size: 13px;
            color: #999;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 34px;
            }

            p {
                font-size: 16px;
            }

            .icon {
                width: 75px;
                height: 75px;
                font-size: 34px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">⚙️</div>

        <h1>Website Under Maintenance</h1>

        <div class="line"></div>

        <p>
            We're currently working on some improvements to make
            your experience even better.
            <br>
            We'll be back shortly.
        </p>

        <div class="status">
            🔧 Maintenance in Progress
        </div>

        <div class="footer">
            © 2026 All Rights Reserved
        </div>

    </div>

</body>
</html>
```
